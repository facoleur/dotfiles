# Keybindings personnels
#
# Sourcé par hyprland.conf APRÈS les défauts Omarchy => tout `bind` ici
# surcharge (ou, avec `unbind`, remplace) les defauts.
#
# Utiliser `bindd` (bind + description) et non `bind` : la description est ce
# qu'affiche le menu Keybindings (SUPER + K), sinon il affiche la commande brute.
#
# Si l'URL d'une web app contient #, l'ecrire ## (sinon Hyprland y voit un commentaire).

# --- Variables ---------------------------------------------------------------

$terminal = uwsm-app -- $TERMINAL
$browser = omarchy-launch-browser

# --- Applications ------------------------------------------------------------

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new

bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT, C, Code, exec, omarchy-launch-or-focus "code"
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, M, Email, exec, omarchy-launch-webapp "https://app.fastmail.com"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian"
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop

bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER, E, File manager (nautilus), exec, uwsm-app -- nautilus

# --- Matériel / système ------------------------------------------------------

bindd = SUPER ALT, W, Wifi, exec, omarchy-launch-wifi
bindd = SUPER ALT, B, Bluetooth settings, exec, omarchy-launch-tui bluetui
bindd = SUPER ALT, H, Bluetooth, exec, omarchy-launch-tui wiremix

# Écran externe : menu de bascule miroir / étendu.
# Remplace le défaut Omarchy (SUPER + P = Pseudo window).
unbind = SUPER, P
bindd = SUPER, P, Mode écran, exec, ~/.local/bin/display-mode menu

bindd = SUPER ALT, A, Sortie audio, exec, ~/.local/bin/audio-mode menu

# Toggle waybar (defaut Omarchy : SUPER + B = Web browser, remplace ici).
unbind = SUPER, B
bindd = SUPER, B, Toggle waybar, exec, pkill -SIGUSR1 waybar

# BrainPaster : sauvegarde clipboard -> Obsidian inbox.
# Remplace le défaut Omarchy (SUPER CTRL + Z = Zoom in).
unbind = SUPER CTRL, Z
bindd = SUPER CTRL, Z, Save clipboard to Obsidian, exec, ~/.local/bin/save-to-obsidian

# Scratchpad désactivé
unbind = SUPER, S

# --- Navigation workspaces ---------------------------------------------------

# Remplacent les défauts Omarchy (SUPER ALT + flèches = Move window to group).
unbind = SUPER ALT, LEFT
unbind = SUPER ALT, RIGHT
bindd = SUPER ALT, LEFT, Previous workspace, workspace, -1
bindd = SUPER ALT, RIGHT, Next workspace, workspace, +1

# Remplacent les défauts Omarchy (SUPER CTRL + flèches = grouped window focus).
unbind = SUPER CTRL, LEFT
unbind = SUPER CTRL, RIGHT
bindd = SUPER CTRL, LEFT, Move window to previous workspace, movetoworkspace, -1
bindd = SUPER CTRL, RIGHT, Move window to next workspace, movetoworkspace, +1

# --- Fenêtres flottantes -----------------------------------------------------

bindd = SUPER CTRL SHIFT, LEFT, Move floating window left, moveactive, -150 0
bindd = SUPER CTRL SHIFT, RIGHT, Move floating window right, moveactive, 150 0
bindd = SUPER CTRL SHIFT, UP, Move floating window up, moveactive, 0 -150
bindd = SUPER CTRL SHIFT, DOWN, Move floating window down, moveactive, 0 150
